name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      # The composite wrapper uses $/ syntax that hosted runners currently reject.
      - uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.11.2
          modules: qtwebengine qtwebchannel qtpositioning qtshadertools
          cache: true
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7' || '' }}
      - name: Select Qt
        shell: bash
        run: |
          qmake_path="$QT_ROOT_DIR/bin/qmake"
          if [ "$RUNNER_OS" = Windows ]; then qmake_path="$qmake_path.exe"; fi
          "$qmake_path" -query QT_VERSION
          echo "QMAKE=$qmake_path" >> "$GITHUB_ENV"
      - name: Select Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./tools/windows/env.ps1
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'LIBCLANG_PATH', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Validate release version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node tools/project.ts)"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: npm run test:native
      - if: runner.os == 'macOS'
        run: brew install cargo-about
      - if: runner.os == 'macOS'
        run: npm run package:mac -- --ad-hoc
      - if: runner.os == 'macOS'
        run: npm run release:mac
      - if: runner.os == 'Windows'
        run: cargo install cargo-about --version 0.9.2 --locked
      - if: runner.os == 'Windows'
        run: npm run package:windows
      - if: runner.os == 'Windows'
        run: npm run release:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wisp-${{ runner.os == 'Windows' && 'windows' || 'macos' }}-${{ matrix.arch }}
          path: |
            dist/Wisp-*.zip
            dist/Wisp-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wisp-*
          merge-multiple: true
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum --check ./*.sha256
          cat > release-notes.md <<'NOTES'
          Wisp for macOS 14+ and experimental Windows x64.

          ## Windows

          1. Download and extract the **windows-x64** ZIP to a permanent folder.
          2. Install the [Microsoft Visual C++ v14 x64 Redistributable](https://aka.ms/vc14/vc_redist.x64.exe) if needed.
          3. Open **Wisp.exe** inside the extracted folder. Keep the whole folder together; Qt is included.

          Windows builds are experimental and unsigned. Settings, sign-in, and cached translations stay in your Windows user profile.

          ## macOS

          Choose **arm64** for Apple Silicon (M-series) or **x64** for Intel. Apple menu → **About This Mac** shows which you have.

          1. Download and unzip the matching ZIP.
          2. Drag **Wisp.app** to **Applications**, then open it.
          3. If macOS cannot verify the developer or check the app, and you trust the download, go to **System Settings → Privacy & Security → Open Anyway** for Wisp, then confirm **Open**.

          These builds aren't Apple-notarized. Approval may be requested again after updates. [Apple's first-launch instructions](https://support.apple.com/en-us/102445) explain this app-specific exception.
          NOTES
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 \
            --verify-tag --draft --title "Wisp $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
