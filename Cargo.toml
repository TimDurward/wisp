[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "A native bilingual companion for WhatsApp Web"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
futures-util = "0.3"
httparse = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
strip = "debuginfo"
